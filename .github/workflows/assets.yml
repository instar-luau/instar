name: assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assets

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134
      - name: generate assets
        run: nu scripts/assets.nu
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/pages
          keep_files: true
