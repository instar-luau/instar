name: assets

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ inputs.tag && 'github-pages' || 'release' }}
  queue: max

jobs:
  assets:
    name: generate assets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: set up nushell
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134
        with:
          check-latest: true

      - name: generate data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: nu scripts/assets.nu

      - name: upload pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages

  deploy:
    name: deploy assets
    needs: assets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # Publish the uploaded Pages artifact.
      id-token: write # Authenticate the Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
