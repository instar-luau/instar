name: update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: hustcer/setup-nu@913f2aa794632a1834b5a6b983bd21832177544b
      - uses: jdx/mise-action@082e167e38ac2494dfb62e04240eac1f2a2d30dc
        with:
          install_args: github:0hirume/breathers
      - name: install instar
        shell: nu {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: nu scripts/update.nu install $env.RUNNER_TEMP
      - name: generate and format
        shell: nu {0}
        run: nu scripts/update.nu ($env.RUNNER_TEMP | path join instar)
      - name: publish updates
        shell: nu {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: nu scripts/update.nu publish
