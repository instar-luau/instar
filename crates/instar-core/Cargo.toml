[package]
name = "instar-core"
version.workspace = true
edition.workspace = true
description = "Core library for the Instar Luau toolchain"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.release]
release = false

[dependencies]
dirs = "6"
globset = "0.4"
line-index = "0.1.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
text-size = "1.1.1"
thiserror = "2.0.20"
tokio = { version = "1", features = ["io-std", "rt", "sync"] }
tower-lsp-server = "0.23.0"
url = "2"
toml_edit = { version = "0.23.5", features = ["serde"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
vermis = "0.2.0"
wasmi = { version = "2.0.0-beta.9", default-features = false, features = ["auto-dispatch", "stable", "std", "validate"] }

[build-dependencies]
cmake = "0.1.58"

[lints]
workspace = true
