[package]
name = "instar-core"
version.workspace = true
edition.workspace = true
description = "Core library for the Instar Luau toolchain"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.release]
release = false

[dependencies]
dirs = "7"
globset = "0.4"
instar-bridge = { path = "../instar-bridge" }
line-index = "0.1.2"
schemars = "1.2.2"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["io-std", "rt", "sync"] }
toml_edit = { version = "0.25", features = ["serde"] }
tower-lsp-server = "0.23.0"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
url = "2"
vermis = "0.2.0"
wasmi = { version = "2.0.0-beta.9", default-features = false, features = ["auto-dispatch", "stable", "std", "validate"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
