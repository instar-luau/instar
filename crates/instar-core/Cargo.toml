[package]
name = "instar-core"
version.workspace = true
edition.workspace = true
description = "Core library for the Instar Luau toolchain"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
globset = "0.4"
line-index = "0.1.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
text-size = "1.1.1"
thiserror = "2.0.20"
toml_edit = { version = "0.23.5", features = ["serde"] }
vermis = { path = "../../../vermis" }
wasmi = { version = "2.0.0-beta.9", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
cmake = "0.1.58"

[lints]
workspace = true
