[package]
name = "instar-core"
version.workspace = true
edition.workspace = true
description = "Core library for the Luau toolchain"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.release]
release = false

[dependencies]
glob = { version = "0.3", default-features = false }
instar-bridge = { path = "../instar-bridge" }
jsonc-parser = { version = "0.34", default-features = false, features = ["serde"] }
petgraph = { version = "0.8", default-features = false, features = ["std", "serde-1"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
schemars = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
vermis = "0.6"

[lints]
workspace = true
