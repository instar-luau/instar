[package]
name = "instar-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for the Luau toolchain"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "instar"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_complete_nushell = "4"
codespan-reporting = "0.13"
color-eyre = "0.6"
console = "0.16"
eyre = "0.6"
glob.workspace = true
ignore = "0.4"
indicatif = "0.18"
instar-analysis.workspace = true
instar-bridge.workspace = true
instar-core.workspace = true
instar-format.workspace = true
instar-lint.workspace = true
rayon = "1"
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "json", "registry"] }

[lints]
workspace = true
