[package]
name = "instar-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for the Luau toolchain"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "instar"
path = "src/main.rs"

[dependencies]
instar-shared.workspace = true
instar-luau.workspace = true
instar-project.workspace = true
instar-format.workspace = true
instar-lint.workspace = true
instar-server.workspace = true

clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.13"
color-eyre = "0.6"
console = "0.16"
eyre = "0.6"
indicatif = "0.18"
serde_json.workspace = true
tempfile.workspace = true
similar.workspace = true
tokio = { version = "1", features = ["rt", "signal", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "json", "registry"] }

[lints]
workspace = true
