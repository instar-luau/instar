[package]
name = "instar-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for the Instar Luau toolchain"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "instar"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
eyre = "0.6.14"
fs-err = { version = "3.3.1", features = ["expose_original_error"] }
tokio = { version = "1.53.1", features = ["rt", "time"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
serde_json = "1.0.151"
tempfile = "3.27.0"

[lints]
workspace = true
