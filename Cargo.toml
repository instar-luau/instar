[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
readme = "README.md"
repository = "https://github.com/instar-luau/instar"
license = "MIT"
keywords = ["formatter", "linter", "lsp", "luau", "roblox"]
categories = ["development-tools"]

[workspace.dependencies]
instar-bridge = { path = "crates/bridge" }
instar-core = { path = "crates/core" }
instar-server = { path = "crates/server" }

clap = { version = "4", features = ["derive"] }
cmake = "0.1"
console = "0.16"
ctrlc = "3"
cxx = "1"
cxx-build = "1"
dirs = "7"
eyre = "0.6"
figment = "0.10"
globset = "0.4"
ignore = "0.4"
indicatif = "0.18"
miette = { version = "7", default-features = false, features = ["fancy-no-syscall"] }
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-cmark-to-cmark = "23"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["hickory-dns", "rustls"] }
same-file = "1"
schemars = "1"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = "1"
toml_edit = "0.25"
tower-lsp-server = { version = "=0.24.0-rc.1", features = ["url-url"] }
tower-service = "0.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "registry"] }
unicode-width = "0.2"
vermis = "0.7"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
assertions_on_result_states = "deny"
branches_sharing_code = "deny"
clear_with_drain = "deny"
clone_on_ref_ptr = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
definition_in_module_root = "deny"
derive_partial_eq_without_eq = "deny"
fallible_impl_from = "deny"
inline_modules = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
self_named_module_files = "deny"
single_char_lifetime_names = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
use_self = "deny"
verbose_file_reads = "deny"

too_many_lines = "allow"

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -1 }

missing_docs = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = "line-tables-only"
