[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/instar-luau/instar"
license = "MIT"
keywords = ["formatter", "linter", "lsp", "luau", "roblox"]
categories = ["development-tools"]

[workspace.dependencies]
glob = "0.3"
instar-analysis = { path = "crates/analysis" }
instar-bridge = { path = "crates/bridge" }
instar-core = { path = "crates/core" }
instar-format = { path = "crates/format" }
instar-lint = { path = "crates/lint" }
instar-syntax = { path = "crates/syntax" }
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
vermis = "0.7"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arbitrary_source_item_ordering = "deny"
clone_on_ref_ptr = "deny"
definition_in_module_root = "deny"
self_named_module_files = "deny"
single_char_lifetime_names = "deny"

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -1 }

missing_docs = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = "line-tables-only"
